<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parol Kuchini Tekshirish</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23667eea'/><path d='M30 45 h40 v30 h-40 z' fill='none' stroke='white' stroke-width='6'/><path d='M38 45 v-10 a12 12 0 0 1 24 0 v10' fill='none' stroke='white' stroke-width='6'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;color:#333}
.container{max-width:480px;margin:0 auto}
header{text-align:center;margin-bottom:24px;color:#fff}
.logo{width:56px;height:56px;margin:0 auto 10px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center}
.logo svg{width:32px;height:32px}
header h1{font-size:1.5rem;font-weight:700;letter-spacing:-0.5px}
header p{opacity:.85;font-size:.9rem;margin-top:4px}
.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.card h3{font-size:1.05rem;margin-bottom:14px;color:#4a5568}
label{display:block;font-size:.85rem;color:#718096;margin-bottom:4px;margin-top:10px}
input[type=number],input[type=text]{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:1rem;outline:none;transition:.2s}
input:focus{border-color:#667eea}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{flex:1;padding:12px;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.2s;min-width:100px}
.btn-primary{background:#667eea;color:#fff}
.btn-primary:hover{background:#5a67d8}
.btn-sec{background:#edf2f7;color:#4a5568}
.btn-sec:hover{background:#e2e8f0}
.btn-green{background:#48bb78;color:#fff}
.result{margin-top:14px;padding:12px;background:#f7fafc;border-radius:10px;font-size:.95rem;line-height:1.5;display:none;max-height:120px;overflow-y:auto}
.result b{color:#5a67d8}
#notif{display:none;background:#2d3748;color:#fff;padding:12px 14px;border-radius:10px;margin-top:12px;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#rnd{font-family:monospace;word-break:break-all}
@media(max-width:400px){body{padding:12px}.card{padding:16px}header h1{font-size:1.3rem}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="10" rx="2"/>
        <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
      </svg>
    </div>
    <h1>Parol Kuchini Tekshirish</h1>
    <p>Oddiy va tez hisoblash</p>
  </header>

  <div class="card">
    <h3>Uzunlik va tezlik</h3>
    <label>Parol uzunligi</label>
    <input type="number" id="len" value="8" min="1" max="32">
    <label>1 daqiqada so‘rovlar soni</label>
    <input type="number" id="rpm" value="1000" min="1">
    <div class="btn-row">
      <button class="btn-primary" onclick="calc()">Hisoblash</button>
    </div>
    <div class="result" id="res1"></div>
  </div>

  <div class="card">
    <h3>Parolni sinash</h3>
    <label>Parolingizni kiriting</label>
    <input type="text" id="pwd" placeholder="Parol...">
    <div class="btn-row">
      <button class="btn-sec" onclick="randomPwd()">Random</button>
      <button class="btn-primary" onclick="check()">Tekshirish</button>
    </div>
    <div id="notif">
      <span id="rnd"></span>
      <button class="btn-green" style="flex:none;padding:8px 14px" onclick="copy()">Nusxa</button>
    </div>
    <div class="result" id="res2"></div>
  </div>
</div>

<script>
const C=95;
function timeStr(s){
  if(s<60)return Math.round(s)+" sekund";
  if(s<3600)return Math.round(s/60)+" daqiqa";
  if(s<86400)return Math.round(s/3600)+" soat";
  if(s<31536000)return Math.round(s/86400)+" kun";
  if(s<3.1536e9)return Math.round(s/31536000)+" yil";
  let a=s/3.1536e9;
  if(a<1e6)return Math.round(a)+" asr";
  if(a<1e12)return Math.round(a/1e6)+" million asr";
  if(a<1e18)return Math.round(a/1e12)+" milliard asr";
  return "∞";
}
function show(el,html){el.innerHTML=html;el.style.display="block"}
function calc(){
  let L=+len.value,R=+rpm.value||1;
  let sec=Math.pow(C,L)/(R/60);
  show(res1,L+" xonali parol taxminan <b>"+timeStr(sec)+"</b> da topiladi.<br>1 daqiqada "+R+" so‘rov.");
}
function check(){
  let p=pwd.value,L=p.length;
  if(!L){show(res2,"Parol kiriting");return}
  let R=+rpm.value||1000;
  let sec=Math.pow(C,L)/(R/60);
  let h=L>=12?"juda qiyin":L>=8?"qiyin":L>=6?"o‘rtacha":"oson";
  show(res2,"Uzunlik: <b>"+L+"</b> belgi<br>Qiyinlik: <b>"+h+"</b><br>Taxminan <b>"+timeStr(sec)+"</b> da topiladi");
}
function randomPwd(){
  let L=+len.value||8,s="";
  for(let i=0;i<L;i++)s+=String.fromCharCode(33+Math.random()*94|0);
  rnd.textContent=s;notif.style.display="flex";pwd.value=s;
}
function copy(){navigator.clipboard.writeText(rnd.textContent)}
</script>
</body>
</html>
