<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <title>Sozlamalar</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="options">
  <h1>Sozlamalar</h1>

  <div class="field">
    <label for="mode">Rejim</label>
    <select id="mode">
      <option value="replace">Replace (default) — har bir harfni teskarisiga almashtiradi</option>
      <option value="lat2cyr">Lotin → Kirill</option>
      <option value="cyr2lat">Kirill → Lotin</option>
    </select>
  </div>

  <label class="check">
    <input type="checkbox" id="showNotification" />
    <span>O‘girilgach bildirishnoma ko‘rsatish</span>
  </label>

  <p class="note">
    Yagona shortcut: <b>Ctrl+Shift</b> (Q bosilmaydi).<br />
    Chrome o‘zi <b>Ctrl+Shift+Q</b> ni brauzerni yopishga olgani uchun u ishlamaydi.<br />
    O‘rnatgach ochiq sahifalarni yangilang. chrome:// va yangi tabda ishlamaydi.
  </p>

  <p id="saved" class="note"></p>
  <script src="options.js"></script>
</body>
</html>
