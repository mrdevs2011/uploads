<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uz Lotin ↔ Kirill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>Lotin ↔ Kirill</h1>
        <p class="hint">Matn yozing — natija darhol chiqadi</p>
      </div>
      <button id="openOptions" class="icon-btn" title="Sozlamalar">⚙</button>
    </header>

    <label class="sr-only" for="input">Matn</label>
    <textarea id="input" rows="6" placeholder="Bu yerga matn yozing yoki joylashtiring..."></textarea>

    <div class="row">
      <span id="status" class="status">Replace</span>
      <div class="actions">
        <button id="swapBtn" class="ghost" title="Inputga natijani qo‘yish">⇄</button>
        <button id="copyBtn" class="primary">Nusxalash</button>
      </div>
    </div>

    <label class="sr-only" for="output">Natija</label>
    <textarea id="output" rows="6" readonly placeholder="Natija shu yerda..."></textarea>

    <p class="foot">
      Sahifada matnni belgilab
      <kbd>Ctrl</kbd>+<kbd>Shift</kbd> bosing — natija clipboardga tushadi.
      Sahifani bir marta yangilang.
    </p>
  </main>
  <script src="converter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
